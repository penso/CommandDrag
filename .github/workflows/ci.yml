name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  security:
    permissions:
      contents: read
    uses: ./.github/workflows/security.yml # zizmor: ignore[self-repository] -- Run the reusable checks at this exact caller commit.
  build:
    name: Universal macOS build
    needs: security
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check scripts and metadata
        run: |
          bash -n build.sh Scripts/release.sh Scripts/package-dmg.sh
          plutil -lint Sources/Info.plist
      - name: Static analysis
        run: |
          xcrun clang --analyze -fobjc-arc -Wall -Wextra -Werror \
            -mmacosx-version-min=13.0 -Xanalyzer -analyzer-output=text \
            Sources/main.m Sources/Focus.m
      - name: Build universal app
        # Exercise macOS's shipped Bash 3.2, including the ad-hoc signing path.
        run: /bin/bash build.sh
      - name: Verify architectures and signature
        run: |
          for arch in arm64 x86_64; do
            lipo build/CommandDrag.app/Contents/MacOS/CommandDrag -verify_arch "$arch"
          done
          codesign --verify --strict --verbose=2 build/CommandDrag.app
      - name: Package CI build
        run: ditto -c -k --sequesterRsrc --keepParent build/CommandDrag.app build/CommandDrag-universal.zip
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build and verify drag-to-install DMG
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r Scripts/dmg-requirements.txt
          DMG_PYTHON=python bash Scripts/package-dmg.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CommandDrag-universal-adhoc
          path: |
            build/CommandDrag-universal.zip
            build/CommandDrag-universal.dmg
          retention-days: 7
