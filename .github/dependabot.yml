version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /Scripts
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      packaging:
        patterns: ['*']
